<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>醫事放射模擬系統</title>
<style>
  :root {
    --side-bg: #f4f5f7; --line: #e3e5ea; --main-bg: #f7f8fc; --text: #333; --muted: #777;
    --accent: #2b6cb0; --danger: #c53030; --low: #2b6cb0; --ok: #2f855a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--text); background: var(--main-bg); }

  /* 左側選單 */
  .sidebar { width: 92px; flex: none; background: var(--side-bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; }
  .logo { font-style: italic; color: #888; font-size: 15px; display: flex; align-items: center; gap: 3px; cursor: pointer; padding: 4px; border: 1px solid transparent; }
  .logo.top { border-color: var(--line); background: #fff; }
  .logo svg { width: 13px; height: 13px; }
  nav { display: flex; flex-direction: column; gap: 6px; }
  nav button { background: none; border: none; cursor: pointer; color: #666; font: inherit; font-size: 13px; line-height: 1.35; padding: 6px 4px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; }
  nav button svg { width: 24px; height: 24px; margin-bottom: 2px; color: #444; }
  nav button:hover { background: #e9ebf0; }
  nav button.active { background: #dde6f3; color: var(--accent); }
  nav button.active svg { color: var(--accent); }

  main { flex: 1; min-width: 0; overflow: auto; }
  .home { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; }

  /* 共用元件 */
  .page { padding: 16px 20px; }
  .page h1 { font-size: 18px; margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
  th { background: #f0f2f6; font-weight: 600; }
  tr.click { cursor: pointer; }
  tr.click:hover { background: #f3f7fc; }
  tr.sel { background: #dde6f3 !important; }
  button.btn { font: inherit; font-size: 14px; padding: 5px 14px; border-radius: 4px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.warn { border-color: var(--danger); color: var(--danger); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  input[type=text], select, textarea { font: inherit; font-size: 14px; padding: 4px 6px; border: 1px solid #bbb; border-radius: 4px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .grow { flex: 1; min-width: 300px; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 8px; font-size: 14px; }
  .kv b { color: var(--muted); font-weight: 400; }
  .red { color: var(--danger); font-weight: 600; }
  .blue { color: var(--low); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 12px; background: #eee; }
  .tag.done { background: #c6f6d5; color: var(--ok); }
  .tag.hold { background: #fed7d7; color: var(--danger); }
  .tag.run { background: #feebc8; color: #b7791f; }
  .progress { position: relative; height: 20px; background: #eee; border: 1px solid #c9cfda; border-radius: 10px; overflow: hidden; margin-top: 10px; }
  .progress div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .progress span { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 20px; color: #222; }
  .log { font-family: monospace; font-size: 12px; max-height: 160px; overflow: auto; background: #fafafa; border: 1px solid var(--line); padding: 6px; }

  /* PACS 影像檢視 */
  .viewer { display: flex; flex-direction: column; height: 100%; background: #000; }
  .vbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px 10px; background: #222; }
  .vbar button { font: inherit; font-size: 13px; padding: 3px 10px; background: #3a3a3a; color: #eee; border: 1px solid #555; border-radius: 3px; cursor: pointer; }
  .vbar button.on { background: var(--accent); border-color: var(--accent); }
  .vbar span { color: #aaa; font-size: 13px; margin-left: 6px; }
  .vwrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .vwrap canvas { cursor: crosshair; max-width: 100%; max-height: 100%; }
  .ov { position: absolute; color: #ffd76a; font-size: 13px; font-family: monospace; line-height: 1.4; pointer-events: none; white-space: pre; }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo top" data-go="home">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13"/><path d="M8 4.5v7M4.5 8h7"/></svg>模擬醫院
  </div>
  <nav>
    <button data-go="ct">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="11" rx="1"/><path d="M2 19h20"/></svg>
      電腦斷層<br>掃描系統</button>
    <button data-go="pacs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M4 17l5-5 4 4 2-2 5 5"/><circle cx="17" cy="6" r="2.5"/><path d="M19 8l2 2"/></svg>
      PACS<br>影像系統</button>
    <button data-go="lab">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-3 4.5-6 7.8-6 11a6 6 0 0 0 12 0c0-3.2-3-6.5-6-11z"/></svg>
      檢驗報告<br>查詢系統</button>
  </nav>
  <div class="logo">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5l5.5 2v4.5c0 3.2-2.4 5.6-5.5 6.5C4.9 13.6 2.5 11.2 2.5 8V3.5z"/><path d="M5.5 8l2 2 3-3.5"/></svg>訓練用
  </div>
</aside>
<main id="main"></main>

<script>
// ===== 模擬資料（皆為虛構） =====
const today = new Date();
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const daysAgo = n => { const d = new Date(today); d.setDate(d.getDate() - n); return ymd(d); };
const todayStr = ymd(today);
const accDay = todayStr.replace(/-/g, '');
const lastYear = ymd(new Date(today.getFullYear() - 1, today.getMonth(), today.getDate()));  // 去年同月同日
function age(dob) {
  const b = new Date(dob); let a = today.getFullYear() - b.getFullYear();
  if (today.getMonth() < b.getMonth() || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate())) a--;
  return a;
}

const patients = {
  '10023456': { name: '王大明', sex: 'M', dob: '1958-03-12', allergy: '無' },
  '10023457': { name: '王大銘', sex: 'M', dob: '1962-07-08', allergy: '無' },
  '10031822': { name: '陳美玲', sex: 'F', dob: '1993-11-02', allergy: '無' },
  '10045519': { name: '林志豪', sex: 'M', dob: '1949-01-25', allergy: 'Penicillin（皮疹）' },
  '10052003': { name: '張淑芬', sex: 'F', dob: '1971-05-30', allergy: '含碘顯影劑（蕁麻疹，2023）' },
  // 教案：CT 室雙病人（A 床門診氣胸、B 床加護病房插管病人）
  '10066188': { name: '黃柏翰', sex: 'M', dob: '2004-08-17', allergy: '無' },
  '10071345': { name: '周國華', sex: 'M', dob: '1957-04-09', allergy: '無' },
  // 糖尿病服用 Metformin（打顯影劑前須注意血糖、腎功能與用藥）；右位心（PACS 危急／異常發現須通報）
  '10083627': { name: '李金鳳', sex: 'F', dob: '1955-02-14', allergy: '無', meds: 'Metformin 500 mg BID、Glimepiride 2 mg QD' },
  '10090412': { name: '吳俊傑', sex: 'M', dob: '1980-06-21', allergy: '無' },
  // 教案：氣胸 X 光與創傷 CT 雙病人（A 床林俊宏、B 床陳建宏），以及音近字近、病歷號尾數對調的干擾病人
  '10098231': { name: '林俊宏', sex: 'M', dob: '1994-07-22', allergy: '無' },
  '10098213': { name: '林峻宏', sex: 'M', dob: '1994-02-11', allergy: '無' },
  '10112745': { name: '陳建宏', sex: 'M', dob: '1966-11-03', allergy: '無', meds: 'Metformin 850 mg BID（新陳代謝科，慢性連續處方，最近領藥 2 週前）、Glimepiride 2 mg QD、Amlodipine 5 mg QD、Atorvastatin 20 mg QD' },
  '10112754': { name: '陳建弘', sex: 'M', dob: '1958-05-20', allergy: '無' },
};

// 使用者提供的真實腹部骨盆 CT（由上而下 01→05）；所有腹部類 CT 醫囑掃描後都顯示這一組
const CT_AP = ['images/b_ct_01.png', 'images/b_ct_02.png', 'images/b_ct_03.png', 'images/b_ct_04.png', 'images/b_ct_05.png'];
const orders = [
  { chart: '10023456', exam: 'Chest CT', region: 'chest', contrast: true, dept: '胸腔內科', dx: '右上肺結節追蹤' },
  { chart: '10023457', exam: 'Brain CT', region: 'brain', contrast: false, dept: '急診醫學科', dx: '頭部外傷，意識改變' },
  { chart: '10031822', exam: 'Abdomen CT', region: 'abdomen', contrast: true, dept: '一般外科', dx: '右下腹痛 r/o 闌尾炎', imgs: CT_AP },
  { chart: '10045519', exam: 'Abdomen CT', region: 'abdomen', contrast: true, dept: '泌尿科', dx: '無痛性血尿', imgs: CT_AP },
  { chart: '10052003', exam: 'Chest CT', region: 'chest', contrast: true, dept: '心臟血管內科', dx: '胸痛 r/o 主動脈剝離' },
  { chart: '10071345', exam: 'Chest+Abdomen+Pelvis CT', region: 'cap', contrast: true, dept: '內科加護病房', dx: '疑似腹內感染之敗血性休克，找感染源',
    time: '15:00', scanSec: 60, cond: '插管使用呼吸器中、Norepinephrine 輸注中（詳見轉送交班單）' },
  { chart: '10083627', exam: 'Abdomen CT', region: 'abdomen', contrast: true, dept: '一般內科', dx: '上腹痛、體重減輕 r/o 胰臟腫瘤', time: '16:00', imgs: CT_AP },
  { chart: '10112745', exam: 'Abdomen+Pelvis CT', region: 'abdomen', site: '腹部＋骨盆', contrast: true, dept: '急診醫學科', dx: '機車車禍多重創傷，左上腹及骨盆壓痛，r/o 腹內出血',
    time: 'STAT', urgent: true, scanSec: 60, find: 'trauma', cond: '創傷病人，頸圈固定中，急診護理師陪同',
    imgs: CT_AP },
  { chart: '10112754', exam: 'Abdomen CT', region: 'abdomen', contrast: true, dept: '泌尿科', dx: '腎結石追蹤', time: '14:30', imgs: CT_AP },
].map((o, i) => ({ ...o, acc: `CT${accDay}${String(i + 1).padStart(3, '0')}`, time: o.time || `${String(8 + i).padStart(2, '0')}:30`, status: '待檢查', note: '' }));

// 項目: [名稱, 單位, 下限, 上限]
const labDefs = {
  CRE: ['Creatinine', 'mg/dL', 0.6, 1.3], EGFR: ['eGFR', 'mL/min/1.73m²', 60, null], BUN: ['BUN', 'mg/dL', 7, 20],
  NA: ['Na', 'mmol/L', 136, 145], K: ['K', 'mmol/L', 3.5, 5.1], WBC: ['WBC', '10³/µL', 4.0, 10.0],
  HB: ['Hb', 'g/dL', 12, 16], PLT: ['PLT', '10³/µL', 150, 400], HCG: ['β-hCG (血清)', 'mIU/mL', null, 5],
  LAC: ['Lactate', 'mmol/L', 0.5, 2.2],
  GLU: ['Glucose (AC)', 'mg/dL', 70, 100], HBA1C: ['HbA1c', '%', 4.0, 5.6],
};
const labs = {
  '10023456': [{ date: daysAgo(3), dept: '胸腔內科', v: { CRE: 0.98, EGFR: 82, BUN: 15, NA: 140, K: 4.1, WBC: 6.2, HB: 14.1, PLT: 230 } }],
  '10023457': [{ date: todayStr, dept: '急診醫學科', v: { CRE: 1.05, EGFR: 74, NA: 138, K: 3.9, WBC: 11.8, HB: 13.5, PLT: 210 } }],
  '10031822': [{ date: todayStr, dept: '一般外科', v: { CRE: 0.62, EGFR: 118, WBC: 13.6, HB: 12.4, PLT: 280, HCG: 1250 } }],
  '10045519': [
    { date: daysAgo(2), dept: '泌尿科', v: { CRE: 2.41, EGFR: 26, BUN: 38, NA: 137, K: 5.4, HB: 10.8, PLT: 198 } },
    { date: daysAgo(60), dept: '腎臟內科', v: { CRE: 1.92, EGFR: 34, BUN: 30, K: 5.0 } },
  ],
  '10052003': [{ date: daysAgo(1), dept: '心臟血管內科', v: { CRE: 0.85, EGFR: 79, NA: 141, K: 4.0, HB: 12.9, PLT: 250, HCG: '<2' } }],
  '10071345': [{ date: todayStr, dept: '內科加護病房', v: { CRE: 2.4, EGFR: 26, WBC: 18.2, LAC: 3.4 } }],
  '10083627': [
    { date: todayStr, dept: '一般內科', v: { GLU: 286, CRE: 1.32, EGFR: 41, BUN: 24, NA: 135, K: 4.6, WBC: 7.8, HB: 11.6, PLT: 215 } },
    { date: daysAgo(90), dept: '新陳代謝科', v: { GLU: 198, HBA1C: 9.1, CRE: 1.18, EGFR: 47 } },
  ],
  '10098213': [{ date: todayStr, dept: '健康管理中心', v: { WBC: 6.1, HB: 15.2, PLT: 245, CRE: 0.88, EGFR: 108, GLU: 92 } }],
  '10112745': [
    { date: todayStr, dept: '急診醫學科', v: { CRE: 2.68, EGFR: 24, BUN: 41, GLU: 268, NA: 137, K: 5.2, WBC: 14.2, HB: 10.4, PLT: 168, LAC: 3.1 } },
    { date: lastYear, dept: '新陳代謝科', v: { CRE: 0.92, EGFR: 88, BUN: 14, GLU: 146, HBA1C: 7.4, NA: 140, K: 4.3, WBC: 6.8, HB: 14.6, PLT: 236 } },
  ],
  '10112754': [{ date: todayStr, dept: '泌尿科', v: { CRE: 0.95, EGFR: 84, GLU: 102, NA: 139, K: 4.0 } }],
};

const studies = [
  // 非本教案考題病人的影像一律使用真實的正常胸部 X 光（images/cxr_normal.png），不用合成繪圖
  { acc: 'XR20250918007', chart: '10023456', date: daysAgo(380), desc: 'Chest PA', region: 'cxr', contrast: false, mod: 'CR', imgs: ['images/cxr_normal.png'] },
  { acc: 'XR20240311015', chart: '10045519', date: daysAgo(560), desc: 'Chest PA', region: 'cxr', contrast: false, mod: 'CR', imgs: ['images/cxr_normal.png'] },
  { acc: 'XR20231102004', chart: '10052003', date: daysAgo(1080), desc: 'Chest PA', region: 'cxr', contrast: false, mod: 'CR', imgs: ['images/cxr_normal.png'] },
  { acc: `XR${accDay}017`, chart: '10066188', date: todayStr, desc: 'Chest PA', region: 'cxr', contrast: false, mod: 'CR', imgs: ['images/cxr_normal.png'] },
  { acc: `XR${accDay}021`, chart: '10090412', date: todayStr, desc: 'Chest PA', region: 'cxr', contrast: false, mod: 'CR', imgs: ['images/cxr_normal.png'] },
  // 教案：A 床林俊宏今日左側氣胸（真實影像 a_cxr_today.png，flip: true 由系統左右翻轉顯示：右下 R 標記反轉、心影在畫面左側）
  // 去年同月同日正常；干擾病人林峻宏今日正常。若改用本身已顛倒的影像檔，請設 flip: false
  { acc: `XR${accDay}031`, chart: '10098231', date: todayStr, desc: 'Chest PA', region: 'cxr', contrast: false, mod: 'CR', find: 'ptx', flip: true, imgs: ['images/a_cxr_today.png'] },
  { acc: `XR${lastYear.replace(/-/g, '')}118`, chart: '10098231', date: lastYear, desc: 'Chest PA', region: 'cxr', contrast: false, mod: 'CR', imgs: ['images/cxr_normal.png'] },
  { acc: `XR${accDay}027`, chart: '10098213', date: todayStr, desc: 'Chest PA', region: 'cxr', contrast: false, mod: 'CR', imgs: ['images/cxr_normal.png'] },
];

// ===== 狀態與路由 =====
const S = { view: 'home', ctSel: null, pacsQ: '', study: null, labQ: '', labChart: null, labRep: null, log: [] };
const main = document.getElementById('main');
const log = msg => S.log.unshift(`${new Date().toLocaleTimeString('zh-TW', { hour12: false })}  ${msg}`);
const pLabel = c => `${patients[c].name}（${c}）`;
const sexAge = p => `${p.sex === 'M' ? '男' : '女'} / ${age(p.dob)} 歲`;

document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => go(el.dataset.go)));
function go(view) {
  S.view = view; S.study = null;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.go === view));
  render();
}
function render() {
  ({ home: () => main.innerHTML = '<div class="home">請由左側選單選擇功能</div>', ct: renderCT, pacs: renderPACS, lab: renderLab })[S.view]();
}

// ===== 電腦斷層掃描系統 =====
function renderCT() {
  const o = orders.find(x => x.acc === S.ctSel);
  main.innerHTML = `<div class="page">
    <h1>電腦斷層掃描系統 <span class="muted">工作清單 ${todayStr}</span></h1>
    <div class="card"><table>
      <tr><th>時間</th><th>檢查單號</th><th>病歷號</th><th>姓名</th><th>性別/年齡</th><th>檢查項目</th><th>顯影劑</th><th>開單科別</th><th>狀態</th></tr>
      ${[...orders].sort((a, b) => !!b.urgent - !!a.urgent).map(x => { const p = patients[x.chart]; return `<tr class="click ${x.acc === S.ctSel ? 'sel' : ''}" data-acc="${x.acc}">
        <td class="${x.urgent ? 'red' : ''}">${x.time}</td><td>${x.acc}</td><td>${x.chart}</td><td>${p.name}</td><td>${sexAge(p)}</td><td>${x.exam}</td>
        <td>${x.contrast ? '有' : '無'}</td><td>${x.dept}</td><td>${statusTag(x.status)}</td></tr>`; }).join('')}
    </table></div>
    ${o ? ctDetail(o) : '<p class="muted">請點選工作清單中的檢查。</p>'}
    ${o && (o.status === '已完成' || o.status === '中止') ? scanImages(o) : ''}
    <div class="card"><h2>操作紀錄 <button class="btn" id="reset" style="float:right;font-size:12px;padding:2px 8px">重設模擬資料</button></h2>
      <div class="log">${S.log.join('<br>') || '（尚無紀錄）'}</div></div>
  </div>`;
  main.querySelectorAll('tr[data-acc]').forEach(tr => tr.onclick = () => {
    S.ctSel = tr.dataset.acc; log(`選取檢查 ${S.ctSel} ${pLabel(orders.find(x => x.acc === S.ctSel).chart)}`); renderCT();
  });
  document.getElementById('reset').onclick = () => confirm('確定重設所有模擬資料？') && location.reload();
  if (o) bindCT(o);
  const vb = document.getElementById('viewimg');
  if (vb) vb.onclick = () => { const st = studies.find(s => s.acc === o.acc); log(`CT 檢視影像 ${o.acc}`); renderViewer(st, renderCT); };
}
// 掃描完成／中止後，在 CT 系統內顯示取得的影像（縮圖＋檢視器），同時已傳送至 PACS
function scanImages(o) {
  const st = studies.find(s => s.acc === o.acc);
  if (!st) return '';
  const n = st.imgs ? st.imgs.length : (SYNTHETIC ? (st.n || totalOf(st.region)) : 0);
  return `<div class="card"><h2>掃描影像 <span class="muted">${n ? n + ' 張，已傳送至 PACS' : '尚無真實影像檔（此醫囑未指定影像）'}</span></h2>
    <div class="row" style="align-items:center">
      ${st.imgs ? st.imgs.slice(0, 6).map(u => `<img src="${u}" alt="" style="height:96px;border:1px solid #333;background:#000" onerror="this.remove()">`).join('') : ''}
      <button class="btn primary" id="viewimg">檢視影像</button>
    </div></div>`;
}
function statusTag(s) { return `<span class="tag ${{ 已完成: 'done', 暫停: 'hold', 中止: 'hold', 掃描中: 'run' }[s] || ''}">${s}</span>`; }

const warn = t => { const m = document.getElementById('msg'); m.textContent = t; m.className = 'red'; };
function bindCT(o) {
  if (o.status !== '待檢查') return;
  const start = document.getElementById('start');
  document.getElementById('hold').onclick = () => {
    const note = document.getElementById('note').value.trim();
    if (!note) return warn('請於備註填寫暫停原因。');
    o.status = '暫停'; o.note = note; log(`暫停檢查 ${o.acc}，原因：${note}`); renderCT();
  };
  start.onclick = () => {
    const useC = document.getElementById('useC').checked;
    if (useC !== o.contrast && !document.getElementById('note').value.trim()) return warn('顯影劑使用與醫囑不同，請於備註填寫原因。');
    o.status = '掃描中'; o.useContrast = useC;
    log(`開始掃描 ${o.acc}（${useC ? '含' : '不含'}顯影劑，${document.getElementById('kvp').value} kVp）`);
    main.querySelectorAll('.card input, .card select, .card textarea, .card button.btn:not(#reset)').forEach(e => e.disabled = true);
    const bar = document.getElementById('bar'), msg = document.getElementById('msg'), pct = document.getElementById('pct');
    msg.className = 'muted';
    const abort = document.getElementById('abort');
    abort.hidden = false; abort.disabled = false;
    const send = n => studies.push({ acc: o.acc, chart: o.chart, date: todayStr, desc: `${o.exam} (${useC ? 'C+' : 'C-'})${n ? '（中止，部分影像）' : ''}`, region: o.region, contrast: useC, n, find: o.find,
      imgs: o.imgs && (n ? o.imgs.slice(0, Math.max(1, Math.round(o.imgs.length * o.pct / 100))) : o.imgs) });
    o.pct = 0;
    const timer = setInterval(() => {
      o.pct++; bar.style.width = o.pct + '%'; pct.textContent = o.pct + '%'; msg.textContent = `掃描中… ${o.pct}%`;
      if (o.pct < 100) return;
      clearInterval(timer);
      o.status = '已完成'; send();
      log(`掃描完成 ${o.acc}，影像已傳送至 PACS`);
      if (S.view === 'ct') renderCT();
    }, (o.scanSec || 4) * 10);
    abort.onclick = () => {
      clearInterval(timer);
      o.status = '中止';
      const n = Math.round(totalOf(o.region) * o.pct / 100);
      if (n) send(n);
      log(`中止掃描 ${o.acc}（進度 ${o.pct}%，已取得 ${n} 張影像）`);
      if (S.view === 'ct') renderCT();
    };
  };
}

// ===== PACS 影像系統 =====
function renderPACS() {
  if (S.study) return renderViewer(S.study);
  const q = S.pacsQ.trim();
  const list = studies.filter(s => !q || s.chart.includes(q) || patients[s.chart].name.includes(q) || s.acc.includes(q))
    .sort((a, b) => b.date.localeCompare(a.date));
  main.innerHTML = `<div class="page">

    </div>
    <div class="card"><table>
      <tr><th>檢查日期</th><th>檢查單號</th><th>病歷號</th><th>姓名</th><th>性別/年齡</th><th>Modality</th><th>檢查描述</th><th>影像數</th></tr>
      ${list.map(s => { const p = patients[s.chart]; return `<tr class="click" data-acc="${s.acc}">
        <td>${s.date}</td><td>${s.acc}</td><td>${s.chart}</td><td>${p.name}</td><td>${sexAge(p)}</td><td>${s.mod || 'CT'}</td><td>${s.desc}</td><td>${s.imgs ? s.imgs.length : (SYNTHETIC ? (s.n || totalOf(s.region)) : '—')}</td></tr>`; }).join('')
        || '<tr><td colspan="8" class="muted">查無影像</td></tr>'}
    </table><p class="muted">點選檢查以開啟影像。</p></div></div>`;
  const search = () => { S.pacsQ = document.getElementById('q').value; renderPACS(); };
  document.getElementById('go').onclick = search;
  document.getElementById('q').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) search(); };
  main.querySelectorAll('tr[data-acc]').forEach(tr => tr.onclick = () => {
    S.study = studies.find(s => s.acc === tr.dataset.acc); log(`PACS 開啟影像 ${S.study.acc} ${pLabel(S.study.chart)}`); renderPACS();

}

const SYNTHETIC = false;   // true 才會在沒有真實影像檔時改畫合成影像；依使用者要求預設關閉
const N = 256, NSLICE = 40;
const totalOf = region => ({ cap: 60, cxr: 1 })[region] || NSLICE;
const presets = {
  img: [['預設', 128, 256]],
  cxr: [['預設', 500, 1000]],
  cap: [['肺窗', -600, 1500], ['縱膈腔', 40, 400], ['腹部', 40, 400], ['骨窗', 400, 1800]],
 chest: [['肺窗', -600, 1500], ['縱膈腔', 40, 400], ['骨窗', 400, 1800]], abdomen: [['腹部', 40, 400], ['肝臟', 60, 160], ['骨窗', 400, 1800]], brain: [['腦窗', 40, 80], ['硬膜下', 75, 215], ['骨窗', 600, 2800]] };
const inEl = (x, y, cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;

// 產生合成 CT 切面（HU 值）
function makeSlice(region, contrast, k, find) {
  const a = new Float32Array(N * N), t = k / Math.max(1, totalOf(region) - 1);
  let seed = k * 9973 + 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // 胸腹骨盆 CT：前 45% 為胸部（右側張力性氣胸），其後為腹部（肝下膿瘍）
  const reg = region === 'cap' ? (t < 0.45 ? 'ptx' : 'abdomen') : region;
  const u = region === 'cap' ? (t < 0.45 ? t / 0.45 : (t - 0.45) / 0.55) : t;
  const s = Math.sin(Math.PI * (0.15 + 0.7 * u));
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = (i - N / 2) / (N / 2), y = (j - N / 2) / (N / 2);
    let v = -1000;
    if (reg === 'cxr') {
      // 胸部 X 光 PA（數值越高越白）：find 為 'ptx' 時左側氣胸、'dextro' 時右位心；影像右側為病人左側
      v = 0;
      if (inEl(x, y, 0, 0.35, 0.9, 1.1) || (Math.abs(x) < 0.18 && y < -0.5)) v = 600;
      const inR = inEl(x, y, -0.38, 0, 0.3, 0.6), inL = inEl(x, y, 0.38, 0, 0.3, 0.6);
      const lungL = find !== 'ptx' || inEl(x, y, 0.33, 0.08, 0.19, 0.48);
      if (inR || (inL && lungL)) {
        const hx = inR ? -0.15 : 0.15, d = Math.hypot(x - hx, y);
        v = 200 + 90 * Math.max(0, Math.cos(Math.atan2(y, x - hx) * 30)) ** 10 * Math.max(0, 1 - d / 0.55);
      } else if (inL) v = 70;
      if (find === 'ptx' && inL && !lungL && inEl(x, y, 0.33, 0.08, 0.2, 0.495)) v = 330;
      if ((inR || inL) && Math.sin((y + 0.3 * x * x) * 28) > 0.85) v += 120;
      if (Math.abs(y - (-0.55 + 0.15 * Math.abs(x))) < 0.03 && Math.abs(x) < 0.6) v = 850;
      if (Math.abs(x) < 0.12 && y < 0.3) v = 750;
      if (inEl(x, y, find === 'dextro' ? -0.1 : 0.1, 0.3, 0.32, 0.25)) v = 720;
      if (Math.abs(x) < 0.06 && v >= 600) v += 80;
      a[j * N + i] = v + (rnd() - 0.5) * 20;
      continue;
    }
    if (reg === 'brain') {
      if (inEl(x, y, 0, 0, 0.72 * s, 0.88 * s)) v = 1000;
      if (inEl(x, y, 0, 0, 0.66 * s, 0.82 * s)) v = 35;
      if (t > 0.35 && t < 0.7 && (inEl(x, y, -0.1, -0.05, 0.06, 0.22) || inEl(x, y, 0.1, -0.05, 0.06, 0.22))) v = 5;
    } else {
      if (inEl(x, y, 0, 0.05, 0.85, 0.6)) v = -100;
      if (inEl(x, y, 0, 0.05, 0.79, 0.54)) v = 40;
      if (region === 'chest') {
        const ls = 0.55 + 0.45 * Math.sin(Math.PI * t);
        if (inEl(x, y, -0.38, 0, 0.28 * ls, 0.4 * ls) || inEl(x, y, 0.38, 0, 0.28 * ls, 0.4 * ls)) v = -850;
        if (t > 0.4 && inEl(x, y, 0.08, 0.02, 0.22, 0.2)) v = contrast ? 160 : 40;
        if (inEl(x, y, 0.1, 0.3, 0.06, 0.06)) v = contrast ? 300 : 45;
      } else if (reg === 'ptx') {
        // 右側張力性氣胸：右半胸（影像左側）充滿空氣無肺紋理、右肺塌陷於肺門，縱膈腔向左（影像右側）偏移
        const ls = 0.55 + 0.45 * Math.sin(Math.PI * u);
        if (inEl(x, y, -0.4, 0.02, 0.34, 0.43)) v = -1000;
        if (inEl(x, y, -0.15, 0.05, 0.08 * ls, 0.12 * ls)) v = -450;
        if (inEl(x, y, 0.47, 0, 0.2 * ls, 0.36 * ls)) v = -850;
        if (u > 0.4 && inEl(x, y, 0.24, 0.04, 0.2, 0.18)) v = contrast ? 160 : 40;
        if (inEl(x, y, 0.2, 0.3, 0.06, 0.06)) v = contrast ? 300 : 45;
      } else {
        if (inEl(x, y, -0.35, -0.02, 0.33 * s, 0.33 * s)) v = contrast ? 110 : 60;
        if (find === 'trauma' && t < 0.55) {
          // 創傷：脾臟撕裂傷（低密度裂隙）合併脾周、肝周腹腔積血
          const sp = inEl(x, y, 0.42, -0.1, 0.16 * s, 0.2 * s);
          if (!sp && inEl(x, y, 0.45, -0.1, 0.27 * s, 0.32 * s)) v = 62;
          if (!inEl(x, y, -0.35, -0.02, 0.33 * s, 0.33 * s) && inEl(x, y, -0.4, -0.02, 0.4 * s, 0.4 * s) && x < -0.45) v = 62;
          if (sp) v = Math.abs((x - 0.42) - 0.5 * (y + 0.1)) < 0.02 ? 30 : (contrast ? 105 : 50);
        }
        if (region === 'cap') {
          // 右側橫膈下壓：上腹切面仍可見右側氣胸；肝下膿瘍（低密度、邊緣顯影）
          if (u < 0.15 && inEl(x, y, -0.5, -0.1, 0.28, 0.3)) v = -1000;
          if (u > 0.25 && u < 0.5 && inEl(x, y, -0.3, 0.14, 0.12, 0.1)) v = contrast ? 140 : 50;
          if (u > 0.25 && u < 0.5 && inEl(x, y, -0.3, 0.14, 0.09, 0.075)) v = 15;
        }
        if (inEl(x, y, -0.32, 0.3, 0.1, 0.12) || inEl(x, y, 0.32, 0.3, 0.1, 0.12)) v = contrast ? 180 : 35;
        if (inEl(x, y, 0.06, 0.28, 0.045, 0.045)) v = contrast ? 250 : 45;
        for (let b = 0; b < 4; b++) if (inEl(x, y, 0.15 + 0.12 * Math.cos(b * 1.7 + t * 6), -0.15 + 0.1 * Math.sin(b * 2.3 + t * 5), 0.05, 0.04)) v = -900;
      }
      if (inEl(x, y, 0, 0.45, 0.1, 0.09)) v = 700;
      if (inEl(x, y, 0, 0.45, 0.07, 0.06)) v = 250;
    }
    a[j * N + i] = v + (rnd() - 0.5) * 20;
  }
  return a;
}

function renderViewer(st, back) {
  const p = patients[st.chart];
  const imgs = st.imgs || null;   // 真實影像檔（JPG/PNG 路徑陣列）
  const ps = imgs || !SYNTHETIC ? presets.img : presets[st.region];
  const ns = imgs ? imgs.length : (SYNTHETIC ? (st.n || totalOf(st.region)) : 1);
  const V = { k: Math.floor(ns / 2), wl: ps[0][1], ww: ps[0][2], inv: false, flip: !!st.flip, zoom: 1, cache: {}, hu: '' };
  main.innerHTML = `<div class="viewer">
    <div class="vbar">
      <button id="back">${back ? '← 返回掃描系統' : '← 返回清單'}</button>
      ${ps.map((x, i) => `<button data-p="${i}">${x[0]}</button>`).join('')}
      <button id="flip">左右翻轉</button><button id="inv">反相</button><button id="zin">放大</button><button id="zout">縮小</button><button id="rst">重設</button>
      <span>滾輪：切換切面　拖曳：調整 W/L　游標：顯示 HU</span>
    </div>
    <div class="vwrap"><canvas id="cv" width="512" height="512"></canvas>
      <div class="ov" id="tl" style="top:8px;left:12px"></div><div class="ov" id="tr" style="top:8px;right:12px;text-align:right"></div>
      <div class="ov" id="bl" style="bottom:8px;left:12px"></div><div class="ov" id="br" style="bottom:8px;right:12px;text-align:right"></div>
      <div class="ov" style="top:50%;left:12px">R</div><div class="ov" style="top:50%;right:12px">L</div>
    </div></div>`;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const off = document.createElement('canvas'); off.width = off.height = N;
  const octx = off.getContext('2d'), img = octx.createImageData(N, N);
  const slice = () => V.cache[V.k] || (V.cache[V.k] = makeSlice(st.region, st.contrast, V.k, st.find));
  const loaded = {};
  const loadImg = (k, cb) => {
    if (loaded[k]) return cb(loaded[k]);
    const im = new Image(); im.onload = () => { loaded[k] = im; cb(im); }; im.onerror = () => cb(null); im.src = imgs[k];
  };
  document.getElementById('tl').textContent = `${p.name}\n${st.chart}\n${sexAge(p)}`;
  document.getElementById('tr').textContent = `模擬醫院\n${st.date}\n${st.acc}\n${st.desc}`;
  const win = g => { g = Math.max(0, Math.min(255, g)); return V.inv ? 255 - g : g; };
  // 把影像畫到畫面上；翻轉時連燒錄在影像上的標記一起鏡像，四角的 R/L 標籤不動（模擬影像送錯方向）
  function paint(src, w, h) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 512, 512);
    ctx.imageSmoothingEnabled = true;
    const sc = Math.min(512 / w, 512 / h) * V.zoom, dw = w * sc, dh = h * sc;
    ctx.save();
    if (V.flip) { ctx.translate(512, 0); ctx.scale(-1, 1); }
    ctx.drawImage(src, (512 - dw) / 2, (512 - dh) / 2, dw, dh);
    ctx.restore();
    const flipped = V.flip !== !!st.flip;   // 只標示使用者自己按的翻轉；送來就反的影像不給提示
    document.getElementById('bl').textContent = `Im: ${V.k + 1}/${ns}\n${st.mod || imgs ? '' : 'Thk: 5.0 mm\n'}Zoom: ${V.zoom.toFixed(1)}x${V.hu}`;
    document.getElementById('br').textContent = `W: ${Math.round(V.ww)}  L: ${Math.round(V.wl)}${V.inv ? '\nINVERT' : ''}${flipped ? '\nFLIP H' : ''}`;
  }
  // 沒有真實影像檔：只顯示提示，不畫合成影像
  function noImage(t) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 512, 512);
    ctx.fillStyle = '#ffd76a'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t, 256, 246); ctx.fillText('請將真實影像檔放入 images/ 資料夾後重新整理', 256, 276); ctx.textAlign = 'left';
    document.getElementById('bl').textContent = `Im: ${V.k + 1}/${ns}\nZoom: ${V.zoom.toFixed(1)}x`;
    document.getElementById('br').textContent = '';
  }
  function draw() {
    const lo = V.wl - V.ww / 2;
    cv.style.filter = '';
    if (imgs) return loadImg(V.k, im => {
      if (!im) { if (!V.warned) { V.warned = true; log(`PACS 影像檔尚未上傳 ${imgs[V.k]}`); } return noImage('影像檔尚未上傳：' + imgs[V.k]); }
      // 真實影像不讀取像素（本機以 file:// 開啟時瀏覽器會擋 getImageData），W/L 與反相改用 CSS filter：
      // 先 contrast 再 brightness，等同 g' = (g - lo) / ww * 255
      paint(im, im.naturalWidth, im.naturalHeight);
      const l = Math.min(120, lo), c = 128 / (128 - l), bgt = Math.min(50, 255 / (V.ww * c));
      cv.style.filter = `grayscale(1) contrast(${c.toFixed(3)}) brightness(${bgt.toFixed(3)})${V.inv ? ' invert(1)' : ''}`;
    });
    if (!SYNTHETIC) return noImage('此檢查尚無真實影像檔');
    const a = slice();
    for (let n = 0; n < N * N; n++) {
      const g = win((a[n] - lo) / V.ww * 255);
      img.data[n * 4] = img.data[n * 4 + 1] = img.data[n * 4 + 2] = g; img.data[n * 4 + 3] = 255;
    }
    octx.putImageData(img, 0, 0);
    // 合成 X 光的鉛字 L 標記（放在病人左側）；影像被翻轉時會跟著鏡像、字形反轉
    if (st.mod === 'CR') { octx.fillStyle = V.inv ? '#000' : '#fff'; octx.font = 'bold 24px sans-serif'; octx.fillText('L', 226, 44); }
    paint(off, N, N);
  }
  const setP = i => { V.wl = ps[i][1]; V.ww = ps[i][2]; draw(); };
  document.getElementById('back').onclick = () => { S.study = null; (back || renderPACS)(); };
  main.querySelectorAll('[data-p]').forEach(b => b.onclick = () => setP(+b.dataset.p));
  document.getElementById('flip').onclick = () => { V.flip = !V.flip; log(`PACS 左右翻轉 ${st.acc}`); draw(); };
  document.getElementById('inv').onclick = () => { V.inv = !V.inv; draw(); };
  document.getElementById('zin').onclick = () => { V.zoom = Math.min(4, V.zoom + 0.5); draw(); };
  document.getElementById('zout').onclick = () => { V.zoom = Math.max(1, V.zoom - 0.5); draw(); };
  document.getElementById('rst').onclick = () => { V.inv = false; V.flip = !!st.flip; V.zoom = 1; setP(0); };
  cv.onwheel = e => { e.preventDefault(); V.k = Math.max(0, Math.min(ns - 1, V.k + Math.sign(e.deltaY))); draw(); };
  let drag = null;
  cv.onmousedown = e => drag = { x: e.clientX, y: e.clientY, wl: V.wl, ww: V.ww };
  window.onmouseup = () => drag = null;
  cv.onmousemove = e => {
    const r = cv.getBoundingClientRect(), sz = 512 * V.zoom;
    let px = ((e.clientX - r.left) * 512 / r.width - (512 - sz) / 2) / sz * N; const py = ((e.clientY - r.top) * 512 / r.height - (512 - sz) / 2) / sz * N;
    if (V.flip) px = N - px;
    V.hu = !st.mod && !imgs && px >= 0 && py >= 0 && px < N && py < N ? `\nHU: ${Math.round(slice()[Math.floor(py) * N + Math.floor(px)])}` : '';
    if (drag) { V.ww = Math.max(1, drag.ww + (e.clientX - drag.x) * 4); V.wl = drag.wl + (e.clientY - drag.y) * 2; }
    draw();
  };
  draw();
}

// ===== 檢驗報告查詢系統 =====
function renderLab() {
  const q = S.labQ.trim();
  const hits = q ? Object.keys(patients).filter(c => c.includes(q) || patients[c].name.includes(q)) : [];
  if (hits.length === 1) S.labChart = hits[0];
  const c = S.labChart, p = c && patients[c];
  const reps = c ? (labs[c] || []).slice().sort((a, b) => b.date.localeCompare(a.date)) : [];
  const r = reps[S.labRep];
  const flag = (k, v) => { const [, , lo, hi] = labDefs[k]; return typeof v === 'number' ? (lo != null && v < lo ? 'L' : hi != null && v > hi ? 'H' : '') : ''; };
  main.innerHTML = `<div class="page">
    <h1>檢驗報告查詢系統</h1>
    <div class="card row" style="align-items:center">
      <span>病歷號／姓名</span><input type="text" id="q" value="${q}"><button class="btn primary" id="go">查詢</button>
    </div>
    ${q && hits.length === 0 ? '<p class="muted">查無符合的病人。</p>' : ''}
    ${hits.length > 1 ? `<div class="card"><h2>符合 ${hits.length} 位病人，請選擇</h2><table>
      <tr><th>病歷號</th><th>姓名</th><th>性別/年齡</th><th>出生日期</th></tr>
      ${hits.map(h => `<tr class="click ${h === c ? 'sel' : ''}" data-c="${h}"><td>${h}</td><td>${patients[h].name}</td><td>${sexAge(patients[h])}</td><td>${patients[h].dob}</td></tr>`).join('')}
    </table></div>` : ''}
    ${p && hits.includes(c) ? `<div class="card"><div class="kv" style="grid-template-columns:70px 1fr 70px 1fr 70px 1fr">
      <b>姓名</b><span>${p.name}</span><b>病歷號</b><span>${c}</span><b>性別/年齡</b><span>${sexAge(p)}</span></div></div>
      <div class="card"><h2>檢驗報告清單</h2>${reps.length ? `<table>
        <tr><th>採檢日期</th><th>開單科別</th><th>檢驗項目</th><th>狀態</th></tr>
        ${reps.map((x, i) => `<tr class="click ${i === S.labRep ? 'sel' : ''}" data-r="${i}"><td>${x.date}</td><td>${x.dept}</td><td>${Object.keys(x.v).map(k => labDefs[k][0]).join('、')}</td><td><span class="tag done">已報告</span></td></tr>`).join('')}
      </table><p class="muted">點選報告以檢視結果。</p>` : '<p class="muted">查無檢驗報告。</p>'}</div>
      ${r ? `<div class="card"><h2>採檢日期 ${r.date}　<span class="muted">${r.dept}</span></h2><table>
        <tr><th>檢驗項目</th><th>結果</th><th>單位</th><th>參考值</th><th>註記</th></tr>
        ${Object.entries(r.v).map(([k, v]) => { const [nm, u, lo, hi] = labDefs[k], f = flag(k, v);
          return `<tr><td>${nm}</td><td class="${f === 'H' ? 'red' : f === 'L' ? 'blue' : ''}">${v}</td><td>${u}</td>
          <td>${lo == null ? '< ' + hi : hi == null ? '≥ ' + lo : lo + ' – ' + hi}</td><td class="${f === 'H' ? 'red' : 'blue'}">${f}</td></tr>`; }).join('')}
      </table></div>` : ''}
      <div class="card"><h2>雲端藥歷 <span class="muted">健保醫療資訊雲端查詢系統，近 3 個月</span></h2>
        ${p.meds ? `<ul style="margin:0;padding-left:18px;font-size:14px">${p.meds.split('、').map(m => `<li>${m}</li>`).join('')}</ul>` : '<p class="muted" style="margin:0">近 3 個月無用藥紀錄。</p>'}</div>` : ''}
  </div>`;
  const search = () => { S.labQ = document.getElementById('q').value; S.labChart = null; S.labRep = null; renderLab(); if (S.labChart) log(`查詢檢驗報告 ${pLabel(S.labChart)}`); };
  document.getElementById('go').onclick = search;
  document.getElementById('q').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) search(); };
  main.querySelectorAll('tr[data-c]').forEach(tr => tr.onclick = () => { S.labChart = tr.dataset.c; S.labRep = null; log(`查詢檢驗報告 ${pLabel(S.labChart)}`); renderLab(); });
  main.querySelectorAll('tr[data-r]').forEach(tr => tr.onclick = () => { S.labRep = +tr.dataset.r; log(`開啟檢驗報告 ${pLabel(c)} 採檢日期 ${reps[S.labRep].date}`); renderLab(); });
}

go('home');
</script>
